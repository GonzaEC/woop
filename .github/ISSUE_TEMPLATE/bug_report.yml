name: Bug report
description: Report something that is not working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Woop
        2. Run `...`
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Woop version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: "PowerShell 7.5, bash 5.2, zsh 5.9, fish 4.0..."
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
